# Phrase patterns (regex, case-insensitive) that mark a HARD escalation category regardless of how the request is worded.
# The Classifier LLM also extracts a category; the stricter of the two wins. Edit here, not in code.
#
# Text is normalised first (NFKC, zero-width characters removed, curly apostrophes made straight, whitespace collapsed).
# Two kinds of signal per category:
#   * <category>:   a list of "strong" patterns - one match is enough.
#   * pairs.<category>: co-occurrence rules - pattern `a` and pattern `b` must both appear within `window` characters
#                       (either order). They catch rephrasings no single phrase list can enumerate.
# Honest limit: regex coverage is finite. This list is the deterministic BACKSTOP; recall is measured by
# tests/data/escalation_rephrasings.yaml (tests/test_hardening.py) and human review remains the final safety net.
safeguarding_concern:
  - |-
    \b(?:forc(?:ing|ed)|pressur(?:ing|ed)|coerc(?:ing|ed)|threaten(?:ing|ed)|controlling|blackmail\w*) (?:me|my)\b
  - |-
    forced me to|being coerced|not allowed to (?:access|use|see|spend) my (?:own )?(?:money|account|card)
  - |-
    (?:afraid|scared|frightened) of|\babus(?:e|ed|ive|er)\b|domestic (?:violence|abuse)|elder(?:ly)? abuse
  - |-
    exploit(?:ed|ing) me|taking (?:my|all my) (?:money|pension|savings)|someone (?:is )?(?:taking|stealing|controlling)
  - |-
    (?:my|an) (?:elderly|vulnerable) (?:mother|father|parent|relative|neighbou?r)
  - |-
    \bfrighten\w*|\bterrified\b|\bintimidat\w+|\bharass(?:ed|ing|ment)\b
  - |-
    \b(?:tell(?:s|ing)|told|ask(?:s|ed|ing)|making|forcing|pressuring|pushing) me to (?:hand over|give|share|reveal|disclose|send|read out) (?:my |her |his |the )?(?:card|pin|password|otp|cvv|details|passbook|cheque ?book)
  - |-
    \b(?:gave|shared|told|handed|read out)\b[^.\n]{0,25}\b(?:otp|pin|password|cvv|card details)\b
  - |-
    \bcontrols? (?:all )?(?:of )?my (?:money|accounts?|finances|bank|salary|cards?)|won'?t (?:give|let) me (?:any )?(?:access|see|use|check|have)|can'?t leave the house
  - |-
    \bscamm?ed\b|being (?:defrauded|conned|tricked|duped)|(?:romance|investment|lottery) scam
  - |-
    \b(?:without my (?:approval|permission|knowledge|consent)|keep (?:it|this|that)(?: transaction)? (?:a )?secret|keep (?:it|this) from|don'?t tell (?:anyone|anybody)|if i tell anyone|(?:he|she|they|someone|\w+) (?:has|have|holds?) power of attorney|(?:doesn'?t|won'?t|does not|will not) (?:allow|let) me|deletes? my (?:bank )?(?:messages?|statements?|alerts?)|(?:logging|logged|log) in(?:to)? (?:to )?my (?:net ?banking|account|online)|(?:withdrawals?|transfers?) (?:that )?i (?:don'?t|do not|did not|didn'?t) (?:recogni[sz]e|make|authori[sz]e)|unauthori[sz]ed (?:withdrawals?|transactions?)|asked for my (?:account|card|pin|otp|password)|(?:keeps?|keep) asking for my (?:card|pin|otp|password)|bail money|cut me off)\b
  - |-
    \b(?:making|pushing|pressing|urging|telling) me to (?:take|put|invest|withdraw|transfer|move)\b|\bmaking me (?:take|withdraw)\b|\bcare home\b|\bgrandson\b[^.\n]{0,30}\b(?:jail|arrested|accident|hospital)\b
  - |-
    \b(?:safe account|(?:holds?|keeps?|has|took|takes) (?:my )?(?:bank |debit |credit |atm )?card and|takes? what (?:he|she|they) wants|manipulat\w+|pay (?:a |an )?(?:fee|tax|charge)\b[^.\n]{0,15}\bfirst|already sent (?:some )?(?:money|cash)|(?:afraid|scared|nervous) to (?:confront|tell|say)|(?:using|uses|used) my (?:net ?banking|online banking|bank account)|asks? (?:her|him|them|me) for cash)\b
