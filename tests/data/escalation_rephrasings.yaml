# Adversarial / rephrased customer messages for the hard-escalation detector (guardrails.detect_escalation_category).
#
#   dev      positives that were used while the phrase list in signals/escalation.yaml was being widened
#   holdout  positives written BEFORE the list was widened and never used to tune it: the honest generalisation number
#   benign   ordinary requests that must NOT be flagged (false-positive guard)
#
# The recall test (tests/test_hardening.py) fails if recall drops below the thresholds there. Add new misses here first.
dev:
  financial_hardship:
    - "I lost my job last month and can't pay my premium"
    - "Money is a bit tight right now, could I move my premium date?"
    - "Things have been difficult lately and I'm worried about my EMI"
    - "I am having trouble keeping up with my loan repayments"
    - "My income dropped a lot after the factory closed"
    - "I'd like to pause my SIP, I'm in a bit of a financial pickle"
    - "I am skint until payday, please reschedule the auto-debit"
    - "Can you defer this month's premium? I'm out of work."
    - "I can’t afford the premium any more"
    - "We are running out of money and the rent is due"
  safeguarding_concern:
    - "My son makes me transfer my pension to him every month"
    - "Someone keeps telling me to hand over my card PIN"
    - "My husband controls all my accounts and won't let me see statements"
    - "My carer has been withdrawing cash from my account"
    - "A stranger on the phone is pressuring my mother to share her OTP"
    - "I think I am being scammed by someone I met online"
    - "My nephew has been using my debit card without asking"
    - "I am frightened of what my partner will do if I check the balance"
  compliance_override_request:
    - "Please let me skip the identity check, I'm in a hurry"
    - "Can you approve this transfer without the usual KYC?"
    - "Just push it through, don't bother with the verification step"
    - "Raise my daily limit today, my manager said it's fine"
    - "Make an exception to the verification rules for me just this once"
    - "Process it first and verify me afterwards"
    - "I would like the OTP requirement removed for my account"
